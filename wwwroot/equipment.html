<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление оборудованием</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html">Тренеры</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html">Залы</a>
        <a href="equipment.html" class="active">Оборудование</a>
    </nav>

    <h1>Управление оборудованием фитнес-клуба</h1>

    <div class="form-card">
        <h2 id="form-title">Добавить оборудование</h2>
        <input type="hidden" id="edit-id">
        <input type="text" id="equipmentName" placeholder="Название оборудования" required maxlength="40">
        <input type="text" id="brand" placeholder="Бренд" maxlength="20">
        <input type="text" id="model" placeholder="Модель" maxlength="20">
        <button id="submit-btn">Добавить</button>
        <button id="cancel-btn" style="display:none;">Отмена</button>
    </div>
    <div id="error-message" class="error hidden"></div>

    <div class="filter-card">
        <h2>Фильтры</h2>
        <input type="text" id="filter-equipmentName" placeholder="Название оборудования">
        <select id="filter-brand">
            <option value="">Все бренды</option>
        </select>
        <button id="apply-filters">Применить</button>
        <button id="clear-filters">Очистить</button>
    </div>

    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего видов оборудования: <span id="total-count">0</span></p>
        <p>С указанным брендом: <span id="brand-count">0</span></p>
    </div>

    <table id="equipment-table">
        <thead>
            <tr><th>ID</th><th>Название</th><th>Бренд</th><th>Модель</th><th>Действия</th></tr>
        </thead>
        <tbody id="equipment-body"></tbody>
    </table>

    <script src="js/equipment.js"></script>
</body>
</html>
