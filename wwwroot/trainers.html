<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление тренерами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html" class="active">Тренеры</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html">Залы</a>
        <a href="equipment.html">Оборудование</a>
    </nav>

    <h1>Управление тренерами фитнес-клуба</h1>

    <!-- Форма добавления/редактирования -->
    <div class="form-card">
        <h2 id="form-title">Добавить тренера</h2>
        <input type="hidden" id="edit-id">
        <input type="text" id="fullName" placeholder="ФИО" required maxlength="50">
        <input type="number" id="experience" placeholder="Стаж (лет)" min="0">
        <button id="submit-btn">Добавить</button>
        <button id="cancel-btn" style="display:none;">Отмена</button>
    </div>
    <div id="error-message" class="error hidden"></div>

    <!-- Панель управления ролями (inline, как инвентарь в Gym) -->
    <div id="roles-card" class="form-card hidden">
        <h2>Роли тренера: <span id="roles-trainer-name"></span></h2>

        <div class="inventory-controls">
            <div class="form-group">
                <label for="role-workout-select">Тренировка</label>
                <select id="role-workout-select">
                    <option value="">— Выберите тренировку —</option>
                </select>
            </div>
            <div class="form-group">
                <label for="role-name-input">Роль</label>
                <input type="text" id="role-name-input" placeholder="стажер, ведущий..." maxlength="100">
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <button id="add-role-btn">Добавить</button>
            </div>
        </div>

        <div class="inventory-table-wrap">
            <table id="role-table">
                <thead>
                    <tr><th>Тренировка</th><th>Роль</th><th>Действия</th></tr>
                </thead>
                <tbody id="role-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Блок фильтров -->
    <div class="filter-card">
        <h2>Фильтры</h2>
        <input type="text" id="filter-fullName" placeholder="ФИО">
        <select id="filter-experienceSort">
            <option value="">Без сортировки</option>
            <option value="asc">По возрастанию стажа</option>
            <option value="desc">По убыванию стажа</option>
            <option value="no_exp">Без опыта</option>
        </select>
        <button id="apply-filters">Применить</button>
        <button id="clear-filters">Очистить</button>
    </div>

    <!-- Блок статистики -->
    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего тренеров: <span id="total-count">0</span></p>
        <p>Со стажем более 2 лет: <span id="exp-count">0</span></p>
        <p>Без опыта: <span id="no-exp-count">0</span></p>
    </div>

    <!-- Таблица с данными -->
    <table id="trainers-table">
        <thead>
            <tr><th>ID</th><th>ФИО</th><th>Стаж (лет)</th><th>Роли</th><th>Действия</th></tr>
        </thead>
        <tbody id="trainers-body"></tbody>
    </table>

    <script src="js/trainers.js"></script>
</body>
</html>
