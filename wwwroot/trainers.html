<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление тренерами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html" class="active">Тренеры</a>
        <a href="workouts.html">Тренировки</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html">Залы</a>
    </nav>

    <h1>Управление тренерами фитнес-клуба</h1>

    <!-- Блок фильтров -->
    <div class="filter-card">
        <h2>Фильтры</h2>
        <div class="filter-grid filter-grid-compact">
            <input type="text" id="filter-fullName" placeholder="ФИО">
            <select id="filter-experienceSort">
                <option value="">Без сортировки</option>
                <option value="asc">По возрастанию стажа</option>
                <option value="desc">По убыванию стажа</option>
                <option value="no_exp">Без опыта</option>
            </select>
        </div>
        <div class="filter-actions" style="margin-top: 10px;">
            <button id="apply-filters">Применить</button>
            <button id="clear-filters">Очистить</button>
            <button id="add-trainer-btn" style="margin-left:auto;">+ Добавить тренера</button>
        </div>
    </div>

    <!-- Блок статистики -->
    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего тренеров: <span id="total-count">0</span></p>
        <p>Со стажем более 2 лет: <span id="exp-count">0</span></p>
        <p>Без опыта: <span id="no-exp-count">0</span></p>
    </div>

    <!-- Таблица с данными -->
    <table id="trainers-table">
        <thead>
            <tr><th>ID</th><th>ФИО</th><th>Стаж (лет)</th><th>Действия</th></tr>
        </thead>
        <tbody id="trainers-body"></tbody>
    </table>
    <div id="trainer-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2 id="modal-title">Добавить тренера</h2>
            <input type="hidden" id="edit-id">
            <div class="form-grid">
                <input type="text" id="fullName" placeholder="ФИО" required maxlength="50">
                <div class="form-group">
                    <label>Стаж (лет)</label>
                    <input type="number" id="experience" placeholder="0" min="0">
                </div>
            </div>
            <div class="form-actions" style="margin-top: 10px;">
                <button id="submit-btn">Добавить</button>
                <button id="cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/trainers.js"></script>
</body>
</html>
