<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление абонементами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html">Тренеры</a>
        <a href="workouts.html">Тренировки</a>
        <a href="abonnements.html" class="active">Абонементы</a>
        <a href="gyms.html">Залы</a>
        <a href="equipment.html">Оборудование</a>
    </nav>

    <h1>Управление абонементами фитнес-клуба</h1>

    <div class="form-card">
        <h2 id="form-title">Добавить абонемент</h2>
        <input type="hidden" id="edit-id">

        <div class="form-grid">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="abonnementType" required>
            </div>
            <div class="form-group">
                <label>Цена (₽)</label>
                <input type="number" id="price" placeholder="Цена (₽)" min="1000" step="0.01" required>
            </div>
            <div class="form-group">
                <label>Длительность (мес)</label>
                <input type="number" id="durationMonths" placeholder="Длительность" min="1" max="18" required>
            </div>
            <div class="form-group">
                <label>В будни</label>
                <select id="weekdayAccess">
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </div>
            <div class="form-group">
                <label>В выходные</label>
                <select id="weekendAccess">
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </div>
            <div class="form-group">
                <label>Время доступа</label>
                <input type="text" id="accessTimeRange" placeholder="08:00 - 23:00" required>
            </div>
            <div class="form-actions">
                <button id="submit-btn">Добавить</button>
                <button id="cancel-btn" style="display:none;">Отмена</button>
            </div>
        </div>
    </div>
    <div class="filter-card">
        <h2>Фильтры</h2>

        <div class="filter-grid">
            <div class="form-group">
                <label>Название</label>
                <input type="text" id="filter-abonnementType" placeholder="Название">
            </div>
            <div class="form-group">
                <label>Доступность в будни</label>
                <select id="filter-weekdayAccess">
                    <option value="">Все</option>
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </div>
            <div class="form-group">
                <label>Доступность на выходные</label>
                <select id="filter-weekendAccess">
                    <option value="">Все</option>
                    <option value="true">Да</option>
                    <option value="false">Нет</option>
                </select>
            </div>
            <div class="form-group">
                <label>Цена от</label>
                <input type="number" id="filter-priceMin" placeholder="Минимальная цена" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Цена до</label>
                <input type="number" id="filter-priceMax" placeholder="Максимальная цена" min="0" step="0.01">
            </div>
            <div class="form-group">
                <label>Сортировка по</label>
                <select id="filter-sortField">
                    <option value="">Без сортировки</option>
                    <option value="price">Цена</option>
                    <option value="duration">Длительность</option>
                </select>
            </div>
            <div class="form-group">
                <label>Направление</label>
                <select id="filter-sortDirection">
                    <option value="asc">По возрастанию</option>
                    <option value="desc">По убыванию</option>
                </select>
            </div>
            <div class="filter-actions">
                <button id="apply-filters">Применить</button>
                <button id="clear-filters">Очистить</button>
            </div>
        </div>
    </div>

    <div class="stats-card">
        <h2>Статистика предложений</h2>
        <p>Всего видов: <span id="total-count">0</span></p>
        <p>Ценовой диапазон: от <span id="min-price">0</span> ₽ до <span id="max-price">0</span> ₽</p>
        <p>Доля безлимитных: <span id="unlimited-percentage">0</span>%</p>
    </div>

    <table id="abonnements-table">
        <thead>
            <tr><th>ID</th><th>Название</th><th>Цена</th><th>Длит. (мес)</th><th>Будни</th><th>Выходные</th><th>Время доступа</th><th>Действия</th></tr>
        </thead>
        <tbody id="abonnements-body"></tbody>
    </table>
    <script src="js/toast.js"></script>
    <script src="js/abonnements.js"></script>
</body>
</html>
