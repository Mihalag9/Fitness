<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление залами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html">Тренеры</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html" class="active">Залы</a>
        <a href="equipment.html">Оборудование</a>
    </nav>

    <h1>Управление залами фитнес-клуба</h1>

    <div class="form-card">
        <h2 id="form-title">Добавить зал</h2>
        <input type="hidden" id="edit-id">
        <input type="text" id="gymName" placeholder="Название зала" required maxlength="30">
        <button id="submit-btn">Добавить</button>
        <button id="cancel-btn" style="display:none;">Отмена</button>
    </div>
    <div id="error-message" class="error hidden"></div>

    <div id="inventory-card" class="form-card hidden">
        <h2>Оборудование в зале: <span id="inventory-gym-name"></span></h2>

        <div class="inventory-controls">
            <div class="form-group">
                <label for="equipment-select">Оборудование</label>
                <select id="equipment-select">
                    <option value="">— Выберите оборудование —</option>
                </select>
            </div>
            <div class="form-group">
                <label for="equipment-quantity">Количество</label>
                <input type="number" id="equipment-quantity" placeholder="Количество" min="1" value="1">
            </div>
            <div class="form-group">
                <label>&nbsp;</label>
                <button id="add-equipment-btn">Добавить / Изменить</button>
            </div>
        </div>

        <div class="inventory-table-wrap">
            <table id="inventory-table">
                <thead>
                    <tr><th>ID</th><th>Название</th><th>Бренд</th><th>Модель</th><th>Кол-во</th><th>Действия</th></tr>
                </thead>
                <tbody id="inventory-body"></tbody>
            </table>
        </div>
    </div>

    <div class="filter-card">
        <h2>Фильтры</h2>
        <input type="text" id="filter-gymName" placeholder="Название зала">
        <select id="filter-hasEquipment">
            <option value="">Все залы</option>
            <option value="true">С оборудованием</option>
            <option value="false">Без оборудования</option>
        </select>
        <input type="text" id="filter-equipmentName" placeholder="Название оборудования">
        <select id="filter-brand">
            <option value="">Все бренды</option>
        </select>
        <button id="apply-filters">Применить</button>
        <button id="clear-filters">Очистить</button>
    </div>

    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего залов: <span id="total-count">0</span></p>
        <p>Всего единиц оборудования: <span id="total-equipment">0</span></p>
    </div>

    <table id="gyms-table">
        <thead>
            <tr><th>ID</th><th>Название</th><th>Оборудование</th><th>Действия</th></tr>
        </thead>
        <tbody id="gyms-body"></tbody>
    </table>

    <script src="js/gyms.js"></script>
</body>
</html>
