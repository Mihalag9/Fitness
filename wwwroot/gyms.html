<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление залами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html">Клиенты</a>
        <a href="trainers.html">Тренеры</a>
        <a href="workouts.html">Тренировки</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html" class="active">Залы</a>
        <a href="equipment.html">Оборудование</a>
    </nav>

    <h1>Управление залами фитнес-клуба</h1>

    <div class="filter-card">
        <h2>Фильтры</h2>
        <div class="filter-grid">
            <input type="text" id="filter-gymName" placeholder="Название зала">
            <select id="filter-hasEquipment">
                <option value="">Все залы</option>
                <option value="true">С оборудованием</option>
                <option value="false">Без оборудования</option>
            </select>
            <input type="text" id="filter-equipmentName" placeholder="Название оборудования">
            <select id="filter-brand">
                <option value="">Все бренды</option>
            </select>
        </div>

        <div class="filter-actions" style="margin-top: 10px;">
            <button id="apply-filters">Применить</button>
            <button id="clear-filters">Очистить</button>
            <button id="add-gym-btn" style="margin-left:auto;">+ Добавить зал</button>
        </div>
    </div>

    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего залов: <span id="total-count">0</span></p>
        <p>Всего единиц оборудования: <span id="total-equipment">0</span></p>
    </div>

    <table id="gyms-table">
        <thead>
            <tr><th>ID</th><th>Название</th><th>Оборудование</th><th>Действия</th></tr>
        </thead>
        <tbody id="gyms-body"></tbody>
    </table>

    <div id="gym-modal" class="modal">
        <div class="modal-content modal-wide">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2 id="modal-title">Добавить зал</h2>
            <input type="hidden" id="edit-id">

            <div class="form-grid">
                <input type="text" id="gymName" placeholder="Название зала" required maxlength="30">
            </div>

            <div class="form-actions" style="margin-top: 10px;">
                <button id="submit-btn">Добавить</button>
                <button id="cancel-btn">Отмена</button>
            </div>

            <div id="inventory-card" class="hidden">
                <div class="gym-section">
                    <h3>Оборудование в зале: <span id="inventory-gym-name"></span></h3>

                    <div class="inventory-controls">
                        <div class="form-group">
                            <label for="equipment-input">Оборудование</label>
                            <div class="autocomplete-wrap">
                                <input type="text" id="equipment-input" placeholder="Начните вводить название" autocomplete="off">
                                <div id="equipment-dropdown" class="dropdown-list hidden"></div>
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="equipment-quantity">Количество</label>
                            <input type="number" id="equipment-quantity" placeholder="Количество" min="1" value="1">
                        </div>
                        <div class="form-group">
                            <label>&nbsp;</label>
                            <button id="add-equipment-btn">Добавить</button>
                        </div>
                    </div>

                    <div class="inventory-table-wrap">
                        <table id="inventory-table">
                            <thead>
                                <tr><th>ID</th><th>Название</th><th>Бренд</th><th>Модель</th><th>Кол-во</th><th>Действия</th></tr>
                            </thead>
                            <tbody id="inventory-body"></tbody>
                        </table>
                    </div>

                    <div id="inventory-pagination" class="inventory-pagination hidden">
                        <button id="inv-prev-btn" class="inv-page-btn" disabled>&lsaquo;</button>
                        <span id="inv-page-info" class="inv-page-info">1 / 1</span>
                        <button id="inv-next-btn" class="inv-page-btn" disabled>&rsaquo;</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/gyms.js"></script>
</body>
</html>
