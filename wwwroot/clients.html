<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление клиентами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="clients.html" class="active">Клиенты</a>
        <a href="trainers.html">Тренеры</a>
        <a href="workouts.html">Тренировки</a>
        <a href="abonnements.html">Абонементы</a>
        <a href="gyms.html">Залы</a>
    </nav>

    <h1>Управление клиентами фитнес-клуба</h1>

    <!-- Блок фильтров -->
    <div class="filter-card">
        <h2>Фильтры</h2>
        <div class="filter-grid filter-grid-compact">
            <input type="text" id="filter-fullName" placeholder="ФИО">
            <input type="text" id="filter-phone" placeholder="Телефон">

            <div class="form-group">
                <label id="filter-birthDateFrom-label">Дата рождения</label>
                <input type="date" id="filter-birthDateFrom" min="1939-01-01" max="2019-12-31">
            </div>

            <div class="form-group hidden" id="filter-birthDateTo-group">
                <label>Дата рождения (до)</label>
                <input type="date" id="filter-birthDateTo" min="1939-01-01" max="2019-12-31">
            </div>
        </div>
        
        <label style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:5px;">
            <input type="checkbox" id="filter-range-toggle"> Диапазон дат
        </label>

        <div class="filter-actions" style="margin-top: 10px;">
            <button id="apply-filters">Применить</button>
            <button id="clear-filters">Очистить</button>
            <button id="add-client-btn" style="margin-left:auto;">+ Добавить клиента</button>
        </div>
    </div>

    <!-- Блок статистики -->
    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего клиентов: <span id="total-count">0</span></p>
        <p>С активным абонементом: <span id="active-abonnements-count">0</span></p>
    </div>

    <!-- Таблица с данными -->
    <table id="clients-table">
        <thead>
            <tr><th>ID</th><th>ФИО</th><th>Дата рождения</th><th>Телефон</th><th>Действия</th></tr>
        </thead>
        <tbody id="clients-body"></tbody>
    </table>
    <div id="client-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close" id="modal-close">&times;</span>
            <h2 id="modal-title">Добавить клиента</h2>
            <input type="hidden" id="edit-id">
            <div class="form-grid">
                <input type="text" id="fullName" placeholder="ФИО" required maxlength="50">
                <div class="form-group">
                    <label>Дата рождения</label>
                    <input type="date" id="birthDate" min="1939-01-01" max="2019-12-31">
                </div>
                <input type="text" id="phone" placeholder="Телефон">
            </div>
            <div class="form-actions" style="margin-top: 10px;">
                <button id="submit-btn">Добавить</button>
                <button id="cancel-btn">Отмена</button>
            </div>
        </div>
    </div>

    <script src="js/toast.js"></script>
    <script src="js/clients.js"></script>
</body>
</html>
