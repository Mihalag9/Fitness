<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фитнес-клуб — Управление клиентами</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Управление клиентами фитнес-клуба</h1>

    <!-- Форма добавления/редактирования -->
    <div class="form-card">
        <h2 id="form-title">Добавить клиента</h2>
        <input type="hidden" id="edit-id">
        <input type="text" id="fullName" placeholder="ФИО" required>
        <input type="date" id="birthDate" placeholder="Дата рождения">
        <input type="text" id="phone" placeholder="Телефон">
        <button id="submit-btn">Добавить</button>
        <button id="cancel-btn" style="display:none;">Отмена</button>
    </div>

    <!-- Блок фильтров -->
    <div class="filter-card">
        <h2>Фильтры</h2>
        <input type="text" id="filter-fullName" placeholder="ФИО">
        <input type="text" id="filter-phone" placeholder="Телефон">
        <input type="date" id="filter-birthDateFrom" placeholder="Дата рождения с">
        <input type="date" id="filter-birthDateTo" placeholder="Дата рождения по">
        <button id="apply-filters">Применить</button>
        <button id="clear-filters">Очистить</button>
    </div>

    <!-- Блок статистики -->
    <div class="stats-card">
        <h2>Статистика</h2>
        <p>Всего клиентов: <span id="total-count">0</span></p>
        <p>С телефоном: <span id="phone-count">0</span></p>
        <p>Активных абонементов: <span id="active-abonnements-count">0</span></p>
    </div>

    <!-- Таблица с данными -->
    <table id="clients-table">
        <thead>
            <tr><th>ID</th><th>ФИО</th><th>Дата рождения</th><th>Телефон</th><th>Действия</th></tr>
        </thead>
        <tbody id="clients-body"></tbody>
    </table>

    <div id="error-message" class="error hidden"></div>
    <script src="js/clients.js"></script>
</body>
</html>
